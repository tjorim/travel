[project]
name = "python-travel"
version = "0.2.0"
description = "Async owner API client for Travel"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14.2"
dependencies = ["aiohttp>=3.13,<4", "pydantic>=2.12,<3"]

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_client"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4", "ty==0.0.99"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
