[project]
name = "travel-home-assistant-dev"
version = "0.1.0"
requires-python = ">=3.14.2,<3.15"
dependencies = ["python-travel", "pytest-homeassistant-custom-component==0.13.375", "ruff==0.17.4", "ty==0.0.99"]

[tool.uv.sources]
python-travel = { path = "../python-travel" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".."]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ty.environment]
extra-paths = [".."]

[tool.ty.rules]
# HA generates writable cached-property annotations through its entity metaclass.
invalid-property-type-override = "ignore"
