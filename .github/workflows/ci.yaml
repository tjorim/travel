name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      archive: ${{ steps.filter.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'dist/*/private/app-import.json'
              - '.github/workflows/ci.yaml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yaml'
            archive:
              - 'dist/**'
              - '.github/workflows/ci.yaml'

  backend:
    name: Backend
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      TRAVEL_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/travel
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: travel
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d travel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dependencies
        run: uv sync --all-groups --frozen
      - name: Install pinned ffmpeg and ffprobe
        run: |
          image=docker.io/mwader/static-ffmpeg:8.0.1@sha256:9a4bf2b7915ef1c4d725a176159438146b68485cc613bf6662e2786c661cd16d
          docker pull "$image"
          container=$(docker create "$image")
          docker cp "$container:/ffmpeg" /tmp/travel-ffmpeg
          docker cp "$container:/ffprobe" /tmp/travel-ffprobe
          docker rm "$container"
          sudo install -m 0755 /tmp/travel-ffmpeg /usr/local/bin/ffmpeg
          sudo install -m 0755 /tmp/travel-ffprobe /usr/local/bin/ffprobe
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest
      - name: Verify migrations against PostgreSQL
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base

  frontend:
    name: Frontend
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10.28.2'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint frontend
        run: pnpm lint
      - name: Check frontend formatting
        run: pnpm format:check
      - name: Audit interface strings and catalogues
        run: pnpm locale:audit
      - name: Check generated message types
        run: pnpm check
      - name: Test frontend regressions
        run: pnpm test --maxWorkers=2
      - name: Build
        run: pnpm build

  static-archive:
    name: Static archive
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.archive == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(git ls-files -z -- 'dist/assets/travel/*.js')
      - name: Validate JSON
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            jq empty "$file"
          done < <(git ls-files -z -- 'dist/*.json' 'dist/**/*.json')
      - name: Check whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
