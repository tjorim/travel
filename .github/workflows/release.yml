name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default. Only `draft` writes (contents) and only `publish-library` gets an OIDC token.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Every tjorim/* repository releases with the same job graph; a repository leaves out what it does not
# have. Publishing is always manual: the last job only drafts the GitHub release.
#
#   validate         tag == VERSION == every versioned file == CHANGELOG        (all repositories)
#   *-checks         the tests that gate this repository's release                (repository specific)
#   publish-library  build and publish the Python client to PyPI, once per tag    (Daynest, Travel)
#   package-*        build release assets (HACS archive, Android APK)             (Daynest, Travel)
#   draft            changelog notes + assets become a draft GitHub release       (all repositories)

jobs:
  validate:
    name: Validate tag, versions and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false

      # The tag, VERSION, every versioned file (including python-travel and its manifest pin) and the
      # CHANGELOG must agree (scripts/release.mjs; configuration in release.config.json).
      - name: Validate tag, versions and changelog
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs check --tag "$TAG"

      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  library-checks:
    name: Library checks
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-travel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run ty check src

      - name: Test
        run: uv run pytest

  publish-library:
    name: Publish python-travel to PyPI
    needs: [validate, library-checks]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: python-travel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build
        run: uv build

      # python-travel shares the app's CalVer, so every tag publishes a new version; a re-run of a tag whose
      # version is already on PyPI skips the upload instead of failing on a duplicate.
      - name: Check if this version is already on PyPI
        id: published
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/python-travel/${VERSION}/json")
          if [[ "${STATUS}" == "200" ]]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "python-travel ${VERSION} is already on PyPI; skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI
        if: steps.published.outputs.already_published == 'false'
        run: uv publish --trusted-publishing always

  package-hacs:
    name: Build HACS archive
    needs: [validate, publish-library]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      # The archive's manifest carries the version and the python-travel pin; publish-library has
      # already put that version on PyPI.
      - name: Build and validate HACS archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python home-assistant/package.py
          python - <<'PY'
          import json
          import os
          from zipfile import ZipFile

          with ZipFile("home-assistant/dist/travel.zip") as archive:
              manifest = json.loads(archive.read("manifest.json"))
          tag = os.environ["TAG"]
          if f"v{manifest['version']}" != tag:
              raise SystemExit("Archive manifest version does not match the release tag")
          if f"python-travel=={manifest['version']}" not in manifest["requirements"]:
              raise SystemExit("Archive manifest does not pin the matching python-travel release")
          PY

      - name: Upload HACS archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-hacs
          path: home-assistant/dist/travel.zip
          if-no-files-found: error

  draft:
    name: Create draft release
    needs: [validate, package-hacs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false

      - name: Extract release notes from the changelog
        run: node scripts/release.mjs notes > "$RUNNER_TEMP/release-notes.md"

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: assets

      # Publishing stays manual, after the archive and its dependency install have been tested.
      - name: Create draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          body_path: ${{ runner.temp }}/release-notes.md
          files: assets/*
          fail_on_unmatched_files: true
