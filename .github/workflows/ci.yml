name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-26.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      python-client: ${{ steps.filter.outputs.python-client }}
      home-assistant: ${{ steps.filter.outputs.home-assistant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'python-travel/**'
              - 'frontend/openapi.json'
              - '.github/workflows/backend-ci.yml'
              - '.github/workflows/ci.yml'
            home-assistant:
              - 'custom_components/travel/**'
              - 'home-assistant/**'
              - 'python-travel/**'
              - 'hacs.json'
              - '.github/workflows/ci.yml'
            python-client:
              - 'python-travel/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend-ci.yml'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-ci.yml

  python-client:
    name: Python client (${{ matrix.python }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.python-client == 'true'
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python: ["3.14", "3.15"]
    defaults:
      run:
        working-directory: python-travel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check src
      - run: uv run pytest
      - run: uv build
      - name: Install wheel independently
        run: |
          uv venv /tmp/travel-client-smoke --python ${{ matrix.python }}
          uv pip install --python /tmp/travel-client-smoke/bin/python dist/*.whl
          /tmp/travel-client-smoke/bin/python -c 'from travel_client import TravelClient'
          uv run python -m py_compile examples/list_tasks.py

  home-assistant:
    name: Home Assistant
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.home-assistant == 'true'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: home-assistant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: home-assistant/.python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run ruff check ../custom_components/travel tests package.py
      - run: uv run ruff format --check ../custom_components/travel tests package.py
      - run: uv run ty check ../custom_components/travel
      - run: uv run pytest
      - run: uv run python package.py

  frontend:
    name: Frontend
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-ci.yml




  dependency-audit:
    name: Dependency audit
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
      - name: Test audit policy
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Audit locked backend and frontend dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/dependency-audit.py

  release-metadata:
    name: Release metadata
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false
      - name: Test release script
        run: node --test scripts/release.verify.mjs
      - name: Check VERSION, versioned files and CHANGELOG agree
        run: node scripts/release.mjs check

  repo-format:
    name: Repository formatting
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend tooling
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Check formatting of workflows, scripts and root JSON
        working-directory: frontend
        run: pnpm run format:repo:check

  hacs:
    name: HACS repository validation
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.home-assistant == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Validate with HACS
        uses: docker://ghcr.io/hacs/action@sha256:187499a09c5d41f9f0d42ff80d203ed87b974c028290140913b61e005fb0aab2
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          CATEGORY: integration
          REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          REPOSITORY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          INPUT_COMMENT: "false"

  gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - backend
      - python-client
      - home-assistant
      - hacs
      - frontend
      - dependency-audit
      - release-metadata
      - repo-format
    runs-on: ubuntu-26.04
    steps:
      - name: Require every job to have passed or been skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
