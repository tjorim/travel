name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      TRAVEL_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/travel
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: travel
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d travel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install dependencies
        run: uv sync --all-groups --frozen
      - name: Install pinned ffmpeg and ffprobe
        run: |
          image=$(awk '$1 == "FROM" && $NF == "ffmpeg" { print $2; exit }' Dockerfile)
          test -n "$image"
          docker pull "$image"
          container=$(docker create "$image")
          docker cp "$container:/ffmpeg" /tmp/travel-ffmpeg
          docker cp "$container:/ffprobe" /tmp/travel-ffprobe
          docker rm "$container"
          sudo install -m 0755 /tmp/travel-ffmpeg /usr/local/bin/ffmpeg
          sudo install -m 0755 /tmp/travel-ffprobe /usr/local/bin/ffprobe
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run ty check .
      - name: Test
        run: uv run pytest
      - name: Verify migrations against PostgreSQL
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base

  frontend:
    name: Frontend
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate UI maintenance inventory
        run: |
          node --test scripts/ui-maintenance.verify.mjs scripts/ui-imports.verify.mjs
          node scripts/ui-maintenance.mjs check
          node scripts/ui-imports.mjs

      - name: Lint frontend
        run: pnpm lint
      - name: Check frontend formatting
        run: pnpm format:check
      - name: Audit interface strings and catalogues
        run: pnpm locale:audit
      - name: Check generated message types
        run: pnpm check
      - name: Test frontend regressions
        run: pnpm test --maxWorkers=2
      - name: Build
        run: pnpm build
      - name: Check bundle budgets
        run: pnpm bundle:check

  frontend-e2e:
    name: Frontend end-to-end
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Compile interface messages
        run: pnpm paraglide:compile
      - name: Run Playwright smoke and accessibility checks
        run: pnpm e2e

  dependency-audit:
    name: Dependency audit
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
      - name: Test audit policy
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Audit locked backend and frontend dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/dependency-audit.py

  gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - backend
      - frontend
      - frontend-e2e
      - dependency-audit
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to have passed or been skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
