name: Draft Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Validate and draft release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false

      # The tag, VERSION, every versioned file and the CHANGELOG must agree.
      - name: Validate tag, versions and changelog
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs check --tag "$TAG"

      - name: Extract release notes from the changelog
        run: node scripts/release.mjs notes > "$RUNNER_TEMP/release-notes.md"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Build and validate HACS archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python home-assistant/package.py
          python - <<'PY'
          import json
          import os
          from zipfile import ZipFile

          with ZipFile("home-assistant/dist/travel.zip") as archive:
              version = json.loads(archive.read("manifest.json"))["version"]
          if f"v{version}" != os.environ["TAG"]:
              raise SystemExit("Archive manifest version does not match the release tag")
          PY

      # Publishing remains manual, after archive and dependency-install testing.
      - name: Create draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          body_path: ${{ runner.temp }}/release-notes.md
          files: home-assistant/dist/travel.zip
          fail_on_unmatched_files: true
          overwrite_files: false
