version: 2
updates:
  # Monitor uv-managed backend dependencies.
  - package-ecosystem: "uv"
    allow:
      - dependency-type: all
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(backend)"
      include: "scope"
    labels:
      - "dependencies"
      - "platform:backend"
    versioning-strategy: "increase"
    groups:
      # fastmcp pulls in mcp, mcp-types and its CLI (cyclopts); keep them moving together
      fastmcp:
        patterns:
          - "fastmcp"
          - "fastmcp-slim"
          - "mcp"
          - "mcp-types"
          - "cyclopts"
      # Keep Pydantic, its validation core, and settings integration together
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-core"
          - "pydantic-settings"
      python-quality:
        patterns:
          - "pytest"
          - "ruff"
          - "ty"
      # markdown-it plugins are pinned against their core release
      markdown:
        patterns:
          - "markdown-it-py"
          - "mdit-py-plugins"
      # psycopg[binary] installs psycopg-binary; they share one release train
      psycopg:
        patterns:
          - "psycopg"
          - "psycopg-binary"
      # timezonefinder ships its data as a separate package
      timezonefinder:
        patterns:
          - "timezonefinder"
          - "timezonefinder-data"
      # Token and OAuth handling: authlib depends on joserfc, PyJWT is the direct JWT library
      auth:
        patterns:
          - "authlib"
          - "joserfc"
          - "pyjwt"

  # pnpm projects use Dependabot's npm ecosystem support.
  - package-ecosystem: "npm"
    allow:
      - dependency-type: all
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "platform:frontend"
    versioning-strategy: "increase"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
      # Group TanStack packages (devtools must track react-query's query-core; router and form ship on the same train)
      tanstack-query:
        patterns:
          - "@tanstack/*"
      testing:
        patterns:
          - "@testing-library/*"
          - "@vitest/*"
          - "vitest"
          - "@playwright/*"
          - "@axe-core/*"
          - "msw"
          - "happy-dom"
          - "fake-indexeddb"
      # The shadcn CLI and its lint companion; Base UI runtime stays ungrouped so its regressions are attributable
      shadcn-cli:
        patterns:
          - "shadcn"
          - "@shadcn/*"
      # Transitive packages that Dependabot would otherwise open one PR each for
      transitive:
        patterns:
          - "baseline-browser-mapping"
          - "enhanced-resolve"
          - "ip-address"
          - "@napi-rs/wasm-runtime"
      oxc:
        patterns:
          - "oxlint"
          - "oxfmt"
          - "oxc-parser"
      i18n:
        patterns:
          - "@inlang/*"
      # Review the map renderer and its scoped dependencies together.
      maplibre:
        patterns:
          - "maplibre-gl"
          - "@maplibre/*"
      # tldts and its core package share one release train.
      tldts:
        patterns:
          - "tldts"
          - "tldts-core"
      # tailwindcss and its Vite plugin share one release train
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"

  # Monitor the backend image's base images.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  # Monitor the images in the local development stack.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      # Toolchain setup actions in ci.yml; they change the same job setup
      setup-actions:
        patterns:
          - "astral-sh/setup-uv"
          - "pnpm/action-setup"
          - "actions/setup-node"
          - "actions/setup-python"
