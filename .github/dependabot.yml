version: 2
updates:
  # Monitor uv-managed backend dependencies.
  - package-ecosystem: "uv"
    allow:
      - dependency-type: all
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(backend)"
      include: "scope"
    labels:
      - "dependencies"
      - "platform:backend"
    versioning-strategy: "increase"
    groups:
      # fastmcp pulls in mcp and mcp-types; cyclopts is its CLI dependency. Keep them moving together
      fastmcp:
        patterns:
          - "fastmcp"
          - "fastmcp-slim"
          - "mcp"
          - "mcp-types"
          - "cyclopts"
      # Keep Pydantic, its validation core, and settings integration together
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-core"
          - "pydantic-settings"
      python-quality:
        patterns:
          - "ruff"
          - "ty"
          - "pytest"
          - "pytest-asyncio"
      # psycopg[binary] installs psycopg-binary; psycopg-pool etc. ship from the same project
      psycopg:
        patterns:
          - "psycopg*"
      # Alembic is built on SQLAlchemy
      sqlalchemy:
        patterns:
          - "sqlalchemy"
          - "alembic"
      # Token, OIDC and JOSE libraries are security-sensitive; review them together.
      # cachetools is a transitive google-auth dependency
      auth:
        patterns:
          - "authlib"
          - "joserfc"
          - "pyjwt"
          - "google-auth"
          - "cachetools"
          - "cryptography"
      # FastAPI request stack and its async/multipart dependencies
      fastapi-stack:
        patterns:
          - "fastapi"
          - "starlette"
          - "python-multipart"
          - "anyio"
      # markdown-it plugins are pinned against their core release
      markdown:
        patterns:
          - "markdown-it-py"
          - "mdit-py-plugins"
      # timezonefinder ships its data as a separate package
      timezonefinder:
        patterns:
          - "timezonefinder"
          - "timezonefinder-data"

  # pnpm projects use Dependabot's npm ecosystem support.
  - package-ecosystem: "npm"
    allow:
      - dependency-type: all
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "platform:frontend"
    versioning-strategy: "increase"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
      # tailwindcss and its Vite plugin share one release train
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      # OXC toolchain: linter, formatter and parser
      oxc:
        patterns:
          - "oxlint"
          - "oxfmt"
          - "oxc-parser"
      # Inlang i18n packages
      i18n:
        patterns:
          - "@inlang/*"
      # Vitest and Testing Library
      # tinybench is vitest's benchmark runner; it is a transitive dependency
      testing:
        patterns:
          - "@testing-library/*"
          - "@vitest/*"
          - "vitest"
          - "tinybench"
      # Browser APIs the tests run against; separate projects from Vitest, so reviewed on their own
      test-env:
        patterns:
          - "happy-dom"
          - "fake-indexeddb"
      # msw's own stack: msw, its @msw/@mswjs packages, and the helpers and cookie/URL packages it ships with.
      # Generic utilities it reaches (yargs, wrap-ansi, type-fest, graphql, ...) stay ungrouped.
      msw:
        patterns:
          - "msw"
          - "@msw/*"
          - "@mswjs/*"
          - "@open-draft/until"
          - "@inquirer/*"
          - "tldts"
          - "tldts-core"
          - "tough-cookie"
          - "outvariant"
          - "rettime"
          - "headers-polyfill"
          - "until-async"
          - "is-node-process"
      # Playwright and the axe-core integration used by the e2e suite
      playwright:
        patterns:
          - "@playwright/*"
          - "@axe-core/*"
      # TanStack Query packages must share one @tanstack/query-core; duplicate copies break QueryClient types
      tanstack-query:
        patterns:
          - "@tanstack/react-query"
          - "@tanstack/react-query-devtools"
          - "@tanstack/query-persist-client-core"
      # TanStack Router with its internals; seroval is router-core's serializer
      tanstack-router:
        patterns:
          - "@tanstack/react-router"
          - "@tanstack/router-*"
          - "@tanstack/history"
          - "isbot"
          - "seroval"
          - "seroval-plugins"
      # Babel packages are transitive and must resolve to one version per major line
      babel:
        patterns:
          - "@babel/*"
      # TypeScript and its runtime helpers
      typescript:
        patterns:
          - "typescript"
          - "tslib"
      # Base UI is the shipped runtime (@base-ui/react and its pinned @base-ui/utils);
      # its behaviour changes get their own PR
      base-ui:
        patterns:
          - "@base-ui/*"
      # shadcn CLI and its registry tooling (dev-only). Kept apart from the Base UI runtime group so a
      # regression is attributable to one of them (docs/ui-maintenance.md)
      shadcn:
        patterns:
          - "shadcn"
          - "@shadcn/*"
      # Icon set kept in its own group so icon releases are reviewed separately
      lucide:
        patterns:
          - "lucide-react"
      # Review the map renderer and its scoped dependencies together
      maplibre:
        patterns:
          - "maplibre-gl"
          - "@maplibre/*"
      # Transitive packages that Dependabot would otherwise open one PR each for
      transitive:
        patterns:
          - "baseline-browser-mapping"
          - "enhanced-resolve"
          - "ip-address"
          - "@napi-rs/wasm-runtime"

  # Monitor the backend image's base images.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  # Monitor the images in the local development stack.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
