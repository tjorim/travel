version: 2
updates:
  # Monitor uv-managed backend dependencies.
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(backend)"
      include: "scope"
    labels:
      - "dependencies"
    versioning-strategy: "increase"
    groups:
      python-quality:
        patterns:
          - "pytest"
          - "ruff"
      # markdown-it plugins are pinned against their core release
      markdown:
        patterns:
          - "markdown-it-py"
          - "mdit-py-plugins"

  # pnpm projects use Dependabot's npm ecosystem support.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
    versioning-strategy: "increase"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
      # Group TanStack Query packages (devtools must track react-query's query-core; duplicate copies drift apart)
      tanstack-query:
        patterns:
          - "@tanstack/react-query"
          - "@tanstack/react-query-devtools"
      testing:
        patterns:
          - "@testing-library/*"
          - "@vitest/*"
          - "vitest"
      oxc:
        patterns:
          - "oxlint"
          - "oxfmt"
      i18n:
        patterns:
          - "@inlang/*"
      # tailwindcss and its Vite plugin share one release train
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
