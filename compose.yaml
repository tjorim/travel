services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist:/srv/travel:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      travel-auth:
        condition: service_healthy
    restart: unless-stopped

  travel-auth:
    build: ./auth
    env_file:
      - ./travel-auth.env
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/travel-auth", "--healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
