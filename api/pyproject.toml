[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travel-api"
version = "0.0.0"
description = "Privacy-first FastAPI backend for the Travel tracker"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.20.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pillow==12.3.0",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.15.0",
  "PyJWT[crypto]==2.13.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.54",
  "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
