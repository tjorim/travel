[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travel-api"
version = "0.0.0"
description = "Privacy-first FastAPI backend for the Travel tracker"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.20.0",
  "cryptography==50.0.2",
  "fastapi==0.142.2",
  "fastmcp==4.0.11",
  "httpx==0.28.1",
  "markdown-it-py==4.2.0",
  "mdit-py-plugins==0.6.1",
  "nh3==0.3.7",
  "pillow==12.3.0",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.15.0",
  "PyJWT[crypto]==2.13.0",
  "python-multipart==0.0.32",
  "slowapi==0.1.9",
  "sqlalchemy==2.1.3",
  "timezonefinder==9.0.0",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.10",
  "ty==0.0.85",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# Applied migrations are history and are not edited to satisfy a type checker.
[tool.ty.src]
exclude = ["alembic"]

# Tests read ORM rows and MCP results they have just created, pass plain strings for enums and use stand-in doubles,
# so argument and optional-access typing is noise there. Unresolved imports, missing arguments and the like still fail.
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-assignment = "ignore"
not-subscriptable = "ignore"
unsupported-operator = "ignore"
not-iterable = "ignore"
invalid-argument-type = "ignore"
invalid-return-type = "ignore"
invalid-method-override = "ignore"
no-matching-overload = "ignore"
