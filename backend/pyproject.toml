[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travel-api"
version = "0.0.0"
description = "Privacy-first FastAPI backend for Travel"
requires-python = ">=3.15"
dependencies = [
  "alembic==1.20.1",
  "cryptography==50.0.2",
  "fastapi==0.162.4",
  "fastmcp==4.1.7",
  "httpx==0.28.1",
  "markdown-it-py==4.3.0",
  "mdit-py-plugins==0.7.0",
  "nh3==0.3.7",
  "pillow==13.0.0",
  "psycopg[binary]==3.3.8",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "pyjwt[crypto]==2.15.1",
  "python-multipart==0.0.33",
  "limits==5.8.0",
  "reportlab==5.1.0",
  "sqlalchemy==2.1.8",
  "timezonefinder==9.2.0",
  "uvicorn[standard]==0.54.0",
  "weasyprint==70.0",
]

[dependency-groups]
dev = [
  "pypdf==7.0.1",
  "pytest==9.2.0",
  "python-travel",
  "ruff==0.17.4",
  "ty==0.0.99",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py315"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# Applied migrations are history and are not edited to satisfy a type checker.
[tool.ty.src]
exclude = ["alembic"]

# Tests read ORM rows and MCP results they have just created, pass plain strings for enums and use stand-in doubles,
# so argument and optional-access typing is noise there. Unresolved imports, missing arguments and the like still fail.
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-assignment = "ignore"
not-subscriptable = "ignore"
unsupported-operator = "ignore"
not-iterable = "ignore"
invalid-argument-type = "ignore"
invalid-return-type = "ignore"
invalid-method-override = "ignore"
no-matching-overload = "ignore"

[tool.uv.sources]
python-travel = { path = "../python-travel" }
